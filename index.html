<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN - Hybrid Social Platform</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090A0D;
            --bg-card: #0F1015;
            --bg-input: #15171F;
            --border-color: rgba(255, 255, 255, 0.08);
            --gold-primary: #D4AF37;
            --gold-light: #F5D061;
            --purple-accent: #8B5CF6;
            --cyan-accent: #06B6D4;
            --text-main: #E5E7EB;
            --text-sub: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 30px;
        }

        /* HEADER */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 16, 21, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding: 10px 14px 4px 14px;
        }

        .brand-title-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.2em;
            background: linear-gradient(135deg, #FFF, #F5D061, #AA8822);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .flourish {
            color: var(--gold-primary);
            font-size: 14px;
        }

        .divider-line {
            height: 1px;
            width: 30px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        /* NAVIGATION TABS */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            padding: 4px 8px;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .tab-btn i {
            font-size: 15px;
        }

        .tab-btn.active {
            color: var(--gold-light);
            border-bottom-color: var(--gold-light);
        }

        /* OCTAGON GEOMETRY */
        .octagon-wrap {
            position: relative;
            display: inline-block;
        }

        .octagon-frame {
            clip-path: polygon(28% 0%, 72% 0%, 100% 28%, 100% 72%, 72% 100%, 28% 100%, 0% 72%, 0% 28%);
            background: linear-gradient(135deg, #F5D061, #D4AF37, #806311);
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .octagon-img {
            clip-path: polygon(28% 0%, 72% 0%, 100% 28%, 100% 72%, 72% 100%, 28% 100%, 0% 72%, 0% 28%);
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #1A1C23;
        }

        /* CARDS & PANELS */
        .card-panel {
            background: rgba(21, 23, 31, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }

        /* POST CREATOR */
        .post-input-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            background-color: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 12px;
            color: #FFF;
            font-size: 12px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--gold-primary);
        }

        .send-btn {
            background: var(--gold-primary);
            border: none;
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .media-preview-container {
            margin-top: 10px;
            position: relative;
            display: none;
        }

        .media-preview-container img, 
        .media-preview-container video {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .remove-media-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.7);
            color: #FFF;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        /* STORIES */
        .stories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
        }
        .stories-scroll::-webkit-scrollbar { display: none; }

        .story-card {
            flex: 0 0 85px;
            height: 130px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        .story-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
        }

        .story-name {
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* FEED CARDS */
        .post-card {
            background: rgba(21, 23, 31, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-user-name {
            font-size: 12px;
            font-weight: 700;
            color: #FFF;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-dev {
            background: rgba(139, 92, 246, 0.2);
            color: var(--purple-accent);
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .post-meta {
            font-size: 10px;
            color: var(--text-sub);
        }

        .post-caption {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .post-media-box {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .post-media-box img,
        .post-media-box video {
            width: 100%;
            display: block;
            max-height: 350px;
            object-fit: cover;
        }

        .post-footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-sub);
        }

        .act-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }

        .act-btn:hover, .act-btn.liked {
            color: var(--gold-light);
        }

        /* PROFILE SECTION */
        .profile-banner {
            width: 100%;
            height: 120px;
            background-size: cover;
            background-position: center;
            border-radius: 12px 12px 0 0;
            position: relative;
        }

        .profile-avatar-pos {
            position: absolute;
            bottom: -25px;
            left: 16px;
        }

        .profile-info {
            padding-top: 32px;
            padding-left: 14px;
            padding-right: 14px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- STICKY HEADER -->
        <header class="sticky-header">
            <div class="brand-title-wrap">
                <span class="flourish">༺</span>
                <div class="divider-line"></div>
                <h1 class="brand-title">SOVEREIGN</h1>
                <div class="divider-line"></div>
                <span class="flourish">༻</span>
            </div>

            <nav class="nav-tabs">
                <button type="button" data-tab="home" id="tab-home" class="tab-btn active">
                    <i class="fa-solid fa-house-chimney"></i>
                    <span>Home</span>
                </button>
                <button type="button" data-tab="friends" id="tab-friends" class="tab-btn">
                    <i class="fa-solid fa-user-group"></i>
                    <span>Friends</span>
                </button>
                <button type="button" data-tab="profile" id="tab-profile" class="tab-btn">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Profile</span>
                </button>
                <button type="button" data-tab="video" id="tab-video" class="tab-btn">
                    <i class="fa-solid fa-circle-play"></i>
                    <span>Video</span>
                </button>
                <button type="button" data-tab="store" id="tab-store" class="tab-btn">
                    <i class="fa-solid fa-shop"></i>
                    <span>Store</span>
                </button>
            </nav>
        </header>

        <!-- MAIN VIEW: HOME / HUB -->
        <main id="view-home" class="view-content" style="padding: 12px;">

            <!-- QUICK POST CREATOR -->
            <div class="card-panel">
                <div class="post-input-box">
                    <div class="octagon-wrap" style="width: 40px; height: 40px;">
                        <div class="octagon-frame" style="width: 40px; height: 40px;">
                            <img id="creatorAvatarImg" src="https://picsum.photos/100/100?random=1" class="octagon-img">
                        </div>
                    </div>
                    <input id="postInputText" type="text" class="input-field" placeholder="Share a status or broadcast...">
                    <button type="button" id="publishBtn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>

                <!-- Attached Media Preview -->
                <div id="mediaPreviewContainer" class="media-preview-container">
                    <button type="button" id="clearMediaBtn" class="remove-media-btn">✕</button>
                    <div id="previewElementHolder"></div>
                </div>

                <!-- Sub Actions -->
                <div style="display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-color); font-size: 11px; color: var(--text-sub);">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
                        <i class="fa-solid fa-image" style="color: #10B981;"></i> Photo/Video
                        <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display: none;">
                    </label>
                    <span style="display: flex; align-items: center; gap: 5px;"><i class="fa-solid fa-headset" style="color: #06B6D4;"></i> Live Voice</span>
                    <span style="display: flex; align-items: center; gap: 5px;"><i class="fa-solid fa-crown" style="color: #D4AF37;"></i> Sovereign</span>
                </div>
            </div>

            <!-- STORIES CAROUSEL -->
            <div style="margin-bottom: 14px;">
                <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px;">
                    <span>FRIENDS STORIES</span>
                    <span style="color: var(--gold-light);">View All</span>
                </div>

                <div class="stories-scroll">
                    <!-- Add Story -->
                    <label class="story-card" style="background-image: url('https://picsum.photos/150/200?random=1'); border-style: dashed;">
                        <input type="file" id="storyFileInput" accept="image/*" style="display: none;">
                        <div class="story-overlay">
                            <div></div>
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <div style="width: 26px; height: 26px; background: var(--gold-primary); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 4px;">+</div>
                                <span class="story-name">Add Story</span>
                            </div>
                        </div>
                    </label>

                    <!-- Story Items -->
                    <div class="story-card" style="background-image: url('https://picsum.photos/150/200?random=2');">
                        <div class="story-overlay">
                            <div class="octagon-wrap" style="width: 24px; height: 24px;">
                                <div class="octagon-frame" style="width: 24px; height: 24px;">
                                    <img src="https://picsum.photos/100/100?random=2" class="octagon-img">
                                </div>
                            </div>
                            <span class="story-name">Alex_Dev</span>
                        </div>
                    </div>

                    <div class="story-card" style="background-image: url('https://picsum.photos/150/200?random=3');">
                        <div class="story-overlay">
                            <div class="octagon-wrap" style="width: 24px; height: 24px;">
                                <div class="octagon-frame" style="width: 24px; height: 24px;">
                                    <img src="https://picsum.photos/100/100?random=3" class="octagon-img">
                                </div>
                            </div>
                            <span class="story-name">Elena_V</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- THE HUB STREAM -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-family: 'Cinzel', serif; font-weight: 800; font-size: 13px; color: #FFF; letter-spacing: 0.1em;">THE HUB</span>
                <span style="font-size: 9px; font-family: 'JetBrains Mono', monospace; background: rgba(212, 175, 55, 0.15); color: var(--gold-light); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(212, 175, 55, 0.3);">Live Broadcasts</span>
            </div>

            <div id="feedStream">
                <!-- Posts render here dynamically -->
            </div>

        </main>

        <!-- VIEW: PROFILE -->
        <main id="view-profile" class="view-content hidden" style="padding: 12px;">
            <div class="card-panel" style="padding: 0; overflow: hidden;">
                <div id="profileBannerDisplay" class="profile-banner" style="background-image: url('https://picsum.photos/600/200?random=50');">
                    <label style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #FFF; padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;">
                        📷 Banner
                        <input type="file" id="bannerFileInput" accept="image/*" style="display: none;">
                    </label>

                    <div class="profile-avatar-pos">
                        <div class="octagon-wrap" style="width: 60px; height: 60px;">
                            <div class="octagon-frame" style="width: 60px; height: 60px;">
                                <img id="profileAvatarDisplay" src="https://picsum.photos/100/100?random=1" class="octagon-img">
                            </div>
                        </div>
                        <label style="position: absolute; bottom: -2px; right: -2px; background: var(--gold-primary); color: #000; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer;">
                            ✏️
                            <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
                        </label>
                    </div>
                </div>

                <div class="profile-info">
                    <h2 id="profileName" style="font-size: 16px; font-weight: 800; color: #FFF;">Justin</h2>
                    <p id="profileHandle" style="font-size: 11px; color: var(--text-sub);">@justin_sovereign • Member</p>
                    <p style="font-size: 12px; margin-top: 8px; color: var(--text-main);">Building SOVEREIGN — High authority hybrid social platform.</p>
                </div>
            </div>
        </main>

        <!-- OTHER TAB VIEWS -->
        <main id="view-friends" class="view-content hidden" style="padding: 20px; text-align: center; color: var(--text-sub);">
            <i class="fa-solid fa-user-group" style="font-size: 32px; margin-bottom: 10px;"></i>
            <p>Friends list module active</p>
        </main
